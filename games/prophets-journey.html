<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة الأنبياء — مركز أسرار الزمان</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#f4e6b4;--line:rgba(200,229,238,.25);--pn:rgba(6,22,31,.86)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:#edf8ff;font-family:Tajawal,Tahoma,sans-serif;background:#041b2c}
body{background:radial-gradient(circle at 20% 10%,rgba(127,215,239,.18),transparent 35%),radial-gradient(circle at 85% 25%,rgba(217,184,106,.14),transparent 30%),linear-gradient(#041b2c,#0a2a3a 60%,#10354d);min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
h1{margin:0;font:700 clamp(30px,6vw,46px) Amiri,serif;color:var(--gold)}
.sub{color:#bfe7f2;margin:4px 0 18px;font-size:14px}
.nour{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--pn);margin-bottom:18px}
.orb{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7fd7ef 45%,#1b83a6);box-shadow:0 0 18px #7fd7ef;animation:p 3s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 30px #7fd7ef;transform:scale(1.06)}}
.nour p{margin:0;line-height:1.9;font-size:15px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.prog{flex:1;min-width:200px}.prog small{color:#bfe7f2}.pb{height:8px;border-radius:5px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}.pb b{display:block;height:100%;background:linear-gradient(90deg,#f4c95d,#7fd7ef);width:0}
button{font-family:inherit}
.btn{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.w{position:relative;text-align:right;padding:14px 14px 12px;border-radius:16px;border:1px solid var(--line);background:var(--pn);color:#fff;cursor:pointer;min-height:104px;transition:transform .15s}
.w:hover{transform:translateY(-3px)}
.w .n{font:700 12px Tajawal;color:#8fb7c4}.w h3{margin:4px 0 8px;font-size:17px}
.w .s{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.w.open,.w.prog,.w.done{border-color:#f4c95d;background:linear-gradient(160deg,rgba(244,201,93,.2),var(--pn))}
.w.done .s{background:#3a8a5f}.w.prog .s,.w.open .s{background:#b78a22;color:#fff}
.w.soon{opacity:.62}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,10,16,.75);z-index:10}.ov.on{display:flex}
.card{width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:20px;border:1px solid var(--line);background:rgba(6,22,31,.97)}
.card h2{margin:0 0 12px;font:700 28px Amiri,serif;color:var(--gold)}
.ach{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.06)}.ach.off{opacity:.45}.ach span{font-size:22px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:var(--pn);border:1px solid var(--line);opacity:0;transition:opacity .3s;pointer-events:none;font-size:14px}#toast.on{opacity:1}
.foot{margin-top:26px;font-size:12px;color:#8fb7c4;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <h1>رحلة الأنبياء</h1>
  <div class="sub">مركز أسرار الزمان</div>
  <div class="nour"><div class="orb"></div><p id="nt"></p></div>
  <div class="top">
    <div class="prog"><small id="pt"></small><div class="pb"><b id="pf"></b></div></div>
    <span class="btn" style="display:inline-flex;gap:8px;align-items:center;padding:4px 12px"><button id="mute" aria-label="كتم" style="background:none;border:0;color:#fff;font-size:20px;cursor:pointer">🔊</button><input id="vol" type="range" min="0" max="100" value="40" aria-label="مستوى الصوت" style="width:90px"></span>
    <button class="btn" id="bn" style="display:none">🎙 إنشاد</button>
    <button class="btn" id="ba">🏆 الإنجازات</button>
    <button class="btn" id="br">إعادة ضبط التقدم</button>
  </div>
  <div class="grid" id="g"></div>
  <div class="foot">«نور» مرشد خيالي تعليمي وليس شخصية من القصص القرآنية. لا يظهر أي نبي في اللعبة بأي صورة. المغامرات التي تظهر «قيد التطوير» لم تُبنَ بعد.</div>
</div>
<div class="ov" id="ov"><div class="card"><h2>الإنجازات</h2><div id="al"></div><button class="btn" id="ac">إغلاق</button></div></div>
<div id="toast"></div>
<script src="prophets-journey/shared/save.js"></script>
<script src="prophets-journey/shared/audio.js"></script>
<script src="prophets-journey/adventures.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var S=PJ.load(),A=window.ADVENTURES||[];
function st(a){
  if(!a.file)return{c:'soon',t:'قيد التطوير'};
  var d=S[a.id]||{};
  if(d.done)return{c:'done',t:'مكتملة ✓'};
  if(d.step>0)return{c:'prog',t:'متابعة — المهمة '+(d.step+1)+' من '+(a.steps||5)};
  return{c:'open',t:'متاحة'};
}
var tt;function toast(m){var e=$('toast');e.textContent=m;e.className='on';clearTimeout(tt);tt=setTimeout(function(){e.className=''},2600)}
function render(){
  var done=A.filter(function(a){return S[a.id]&&S[a.id].done}).length;
  $('pt').textContent='المغامرات المكتملة: '+done+' من '+A.length;
  $('pf').style.width=(done/A.length*100)+'%';
  $('nt').textContent=done?'أحسنت! أكملتَ '+done+' من المغامرات. اختر عالمًا جديدًا أو أعد زيارة عالم تحبه.':'مرحبًا! أنا نور، مرشدك في مركز أسرار الزمان. اختر مغامرة من المغامرات المتاحة لتبدأ رحلتك.';
  var g=$('g');g.innerHTML='';
  A.forEach(function(a,i){
    var s=st(a),b=document.createElement('button');
    b.className='w '+s.c;
    b.innerHTML='<div class="n">'+(i+1)+'</div><h3></h3><span class="s">'+s.t+'</span>';
    b.querySelector('h3').textContent=a.name;
    b.onclick=function(){if(a.file){location.href=a.file}else toast('هذه المغامرة قيد التطوير وستُفتح قريبًا')};
    g.appendChild(b);
  });
}
function achievements(){
  var y=S.yunus||{};
  return[
    {i:'🧭',t:'أول غوص',d:'ابدأ مغامرة يونس وتجاوز مهمة التدريب',on:y.done||y.step>0},
    {i:'🔮',t:'جامع اللآلئ',d:'اجمع لآلئ القصة الخمس',on:y.done||y.pearls>=5||y.step>=2},
    {i:'🌟',t:'ختم أسرار الزمان: يونس',d:'أكمل مغامرة يونس عليه السلام',on:!!y.done}
  ];
}
$('ba').onclick=function(){
  var l=$('al');l.innerHTML='';
  achievements().forEach(function(a){var d=document.createElement('div');d.className='ach'+(a.on?'':' off');d.innerHTML='<span>'+a.i+'</span><div><b></b><div style="font-size:12px;color:#bfe7f2"></div></div>';d.querySelector('b').textContent=a.t;d.querySelector('div div').textContent=a.d;l.appendChild(d)});
  $('ov').className='ov on';
};
$('ac').onclick=function(){$('ov').className='ov'};
$('br').onclick=function(){if(confirm('هل تريد مسح كل تقدمك في رحلة الأنبياء؟')){if(PJ.reset()){S=PJ.load();render();toast('تمت إعادة ضبط التقدم')}else toast('تعذّر مسح التقدم')}};
PJ.audio.bindUI($('mute'),$('vol'));
document.addEventListener('pointerdown',function(){PJ.audio.init('hub')},{once:true});
PJ.audio.probe('prophets-journey/audio/nasheed.mp3',function(ok){if(!ok)return;var b=$('bn');b.style.display='';b.onclick=function(){if(PJ.audio.playing()){PJ.audio.stop();b.textContent='🎙 إنشاد'}else{PJ.audio.init('hub');PJ.audio.play('prophets-journey/audio/nasheed.mp3',true);b.textContent='⏸ إيقاف الإنشاد'}}});
render();
})();
</script>
</body>
</html>
